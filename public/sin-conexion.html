<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sin conexión</title>
<!--
  La guarda el service worker y sale cuando no hay cobertura y la página
  no se había visto antes. Va entera en un archivo: justo ahora no se
  podría pedir nada más. Es la misma para todos los organizadores.
-->
<style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 24px; box-sizing: border-box; background: #f5f5f5; color: #171717;
           font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .caja { max-width: 420px; padding: 28px 26px; background: #fff; border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 16px; color: #525252; }
    a { display: inline-block; padding: 11px 20px; border-radius: 8px; background: #171717; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div class="caja">
    <h1>Sin conexión</h1>
    <p>No hay cobertura ahora mismo. Las páginas de torneos que ya habías abierto se ven sin conexión; para inscribirte o anotar un resultado hace falta red.</p>
    <a href="/">Volver a intentarlo</a>
</div>
</body>
</html>
